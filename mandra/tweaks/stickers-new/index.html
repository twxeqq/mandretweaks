<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <link href="https://db.onlinewebfonts.com/c/d7e8a95865396cddca89b00080d2cba6?family=SoDo+Sans+SemiBold" rel="stylesheet">
        <title>Твики для стикеров</title>
    </head>
    <body>
        <div class="navbar">
            <div class="navbar-left">
                <img src="assets/logo.png">
                <div>MandreTweaks</div>
            </div>
            <div class="navbar-right">
                <div class="channel-link desktop">
                    <svg xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.894 8.221l-1.97 9.28c-.145.658-.537.818-1.084.508l-3-2.21-1.446 1.394c-.14.14-.26.26-.534.26l.213-3.053 5.56-5.023c.242-.213-.054-.334-.373-.121l-6.871 4.326-2.962-.924c-.643-.204-.657-.643.136-.953l11.57-4.46c.538-.196 1.006.128.832 2.957z"/>
                    </svg>
                    <a href="https://t.me/swagnonher" target="_blank">Официальный канал</a>
                </div>   
                <a href="https://t.me/sterepando" class="filled-link desktop" target="_blank">Разработчик</a>
                <a href="https://t.me/swagnonher/338" class="unfield-link desktop" target="_blank">Поддержать</a>
            </div>
        </div>
        <main class="container">
            <h1 class="title">Добавляет новые возможности<br>в меню предпросмотра стикеров</h1>
            <div class="cards">
                <div class="left-card">
                    <div class="card-preview">
                        <img src="assets/stickers-left.png" class="img-left" alt="Копирование">
                    </div>
                    <p class="card-text">Копируйте стикеры в<br>свои стикерпаки</p>
                </div>
                <div class="center-card">
                    <div class="card-preview">
                        <img src="assets/stickers-1.png" class="img-1" alt="Новые возмосности">
                        <img src="assets/stickers-main.png" class="img-main" alt="Твик">
                    </div>
                    <p class="card-text">Копируйте айди<br>стикеров</p>
                </div>
                <div class="right-card">
                    <div class="card-preview">
                        <img src="assets/stickers-right.png" class="img-right" alt="Меню">
                    </div>
                    <p class="card-text">Отправляйте без привязки к<br>стикерпаку и сохраняйте<br>в загрузки</p>
                </div>
            </div>
        </main>
        <script src="script.js"></script>
    </body>
</html>
