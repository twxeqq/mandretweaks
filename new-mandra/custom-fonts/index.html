<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css?v=42">
            <link href="https://db.onlinewebfonts.com/c/d7e8a95865396cddca89b00080d2cba6?family=SoDo+Sans+SemiBold" rel="stylesheet">
        <title>Custom fonts</title>
    </head>
    <body>
        <div class="bg" aria-hidden="true">
            <canvas id="bg-canvas"></canvas>
            <div class="grain"></div>
            <div class="vignette"></div>
        </div>

        <div class="custom-cursor" aria-hidden="true"></div>
        <div class="navbar">
            <div class="navbar-left">
                <img src="assets/logo.png" alt="logo" class="logo">
                <h1 class="title">mandretweaks</h1>
            </div>
            <div class="navbar-right">
                <div class="links desktop">
                    <a href="https://t.me/swagnonher" class="channel-link">официальный канал</a>
                    <a href="https://t.me/sterepando" class="profile-link"><span>разработчик</span></a>
                    <a href="../index.html" class="main-link">главная страница</a>
                </div>

                 <!--mobile navbar-->
                <div class="burger mobile">
                    <div class="openbtn">
                        <svg class="open-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://w3.org">
                          <path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                    </div>
                    <div class="closebtn">
                        <svg class="close-icon" xmlns="http://w3.org" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                          <line x1="18" y1="6" x2="6" y2="18"></line>
                          <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </div>
                </div>  
            </div>
        </div>
        <div class="menu mobile">
            <div class="links-m">
                <a href="../index.html" class="moblink">Главная страница</a>
                <a href="https://t.me/swagnonher" target="_blank" class="moblink">Официальный канал</a> 
                <a href="https://t.me/sterepando" class="moblink" target="_blank">Разработчик</a>
                <a href="https://t.me/swagnonher/388" class="moblink" target="_blank">Поддержать</a>
            </div>    
        </div>
        <main class="container">
            <div class="title-container">
                <h1 class="title-h">Шрифт, который ВЫ<br><span>хотите видеть</span></h1>
                <p class="desc">Кастомизируйте шрифт как захотите<br>Абсолютно любой — otf, ttf. Вы — индивидуальны</p>
            </div>    
            <div class="main-container desktop">
                <div class="img-card">
                    <img src="assets/no-cf-1.jpg" class="img-base" alt="без шрифта 1">
                    <img src="assets/with-cf-1.jpg" class="img-hover" alt="со шрифтом 1">
                </div>
                <div class="img-card">
                    <img src="assets/no-cf-2.jpg" class="img-base" alt="без шрифта 2">
                    <img src="assets/with-cf-2.jpg" class="img-hover" alt="со шрифтом 2">
                </div>
                <div class="img-card">
                    <img src="assets/no-cf-3.jpg" class="img-base" alt="без шрифта 3">
                    <img src="assets/with-cf-3.jpg" class="img-hover" alt="со шрифтом 3">
                </div>
            </div>
            <div class="main-container-m mobile">
                <div class="img-card-m">
                    <img src="assets/no-cf-1.jpg" class="img-base-m img-1" alt="без шрифта 1">
                </div>
                <div class="img-card-m">
                    <img src="assets/no-cf-2.jpg" class="img-base-m img-2" alt="без шрифта 2">
                </div>
                <div class="img-card-m">
                    <img src="assets/no-cf-3.jpg" class="img-base-m img-3" alt="без шрифта 3">
                </div>
            </div>
        </main>
        <div class="font-modal mobile" id="font-modal" aria-hidden="true">
            <div class="modal-backdrop"></div>

            <button class="modal-close" aria-label="Закрыть">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>

            <div class="modal-wrapper">
                <div class="modal-stack">
                    <!-- без шрифта -->
                     <div class="modal-card card-base">
                        <span class="modal-badge">Без шрифта</span>
                        <img src="" class="modal-img img-target-base" alt="Оригинал" draggable="false">
                     </div>

                    <!-- со шрифтом -->

                    <div class="modal-card card-custom">
                        <span class="modal-badge badge-accent">Со шрифтом</span>
                        <img src="" class="modal-img img-target-custom" alt="Со шрифтом" draggable="false">
                    </div>

                    <!-- Разделитель режима сравнения -->
                    <div class="compare-slider" id="compare-slider" aria-label="Сравнение шрифтов">
                        <div class="compare-divider-line"></div>
                        <div class="compare-handle" aria-hidden="true">
                            <svg class="compare-handle-arrows" viewBox="0 0 20 12" width="20" height="12" fill="none">
                                <polygon points="6,2 2,6 6,10" fill="#9ca3af" stroke="#9ca3af" stroke-width="0.5" stroke-linejoin="round"/>
                                <polygon points="14,2 18,6 14,10" fill="#9ca3af" stroke="#9ca3af" stroke-width="0.5" stroke-linejoin="round"/>
                            </svg>
                        </div>
                    </div>
                </div>
            </div>
            <div class="bell-toggle" data-on="false" id="font-toggle">
                <button type="button" class="bell-toggle__button" aria-pressed="false" aria-label="Переключатель шрифта">
                    <span class="bell-toggle__bell" aria-hidden="true">
                        <span class="bell-toggle__glyph">А</span>
                    </span>
                    <span class="bell-toggle__say" aria-hidden="true">
                        <span class="bell-toggle__face bell-toggle__face--off">Без шрифта</span>
                        <span class="bell-toggle__face bell-toggle__face--on">Со шрифтом</span>
                    </span>
                </button>
            </div>
            <button type="button" class="hold-btn" aria-label="Переключить режим">
                <span class="hold-btn-fill">
                    <svg class="hold-wave" viewBox="0 0 10 160" preserveAspectRatio="none">
                        <path d="M0,0 Q8,10 0,20 Q8,30 0,40 Q8,50 0,60 Q8,70 0,80 Q8,90 0,100 Q8,110 0,120 Q8,130 0,140 Q8,150 0,160 L0,0 Z" />
                    </svg>
                </span>
                <span class="hold-btn-content">
                    <svg class="hold-btn-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 16 14"></polyline>
                    </svg>
                    <span class="hold-btn-text">Режим сравнения</span>
                </span>
            </button>
        </div>
        <script src="script.js?v=42"></script>
    </body>
</html>
